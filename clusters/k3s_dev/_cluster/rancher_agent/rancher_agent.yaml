apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-agent
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: rancher-agent-import
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://github.com/ondrejsika/argocd-apps-public.git
    path: ./clusters/k3s_dev/_cluster/rancher_agent/manifests
