# Applies the Rancher import manifest (cattle-cluster-agent), after that
# the agent is managed by Rancher, not by ArgoCD
#
# Secret rancher-import (key url) is created manually, see docs/rancher/README.md
apiVersion: batch/v1
kind: Job
metadata:
  name: rancher-agent-import
  namespace: rancher-agent-import
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  # Fail if the Secret is missing, otherwise the Job (Sync hook) waits forever
  # and blocks ArgoCD from syncing a new revision (e.g. with the Secret)
  activeDeadlineSeconds: 300
  template:
    spec:
      serviceAccountName: rancher-agent-import
      restartPolicy: OnFailure
      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.36.6
          args:
            - apply
            - -f
            - $(IMPORT_URL)
          env:
            - name: IMPORT_URL
              valueFrom:
                secretKeyRef:
                  name: rancher-import
                  key: url
