# The Rancher import manifest creates cluster-admin bindings for the agent,
# so the import Job needs cluster-admin too
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rancher-agent-import
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: rancher-agent-import
    namespace: rancher-agent-import
