apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elastic
  namespace: elastic
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - es.elastic.sikademo.com
      secretName: es.elastic.sikademo.com-tls
    - hosts:
        - kb.elastic.sikademo.com
      secretName: kb.elastic.sikademo.com-tls
  rules:
    - host: es.elastic.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elastic-es-http
                port:
                  number: 9200
    - host: kb.elastic.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elastic-kb-http
                port:
                  number: 5601
