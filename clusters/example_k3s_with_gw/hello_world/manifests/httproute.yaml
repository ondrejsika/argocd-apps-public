apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-world
  namespace: hello-world
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: hello-world
  hostnames:
    - hello-world.k3s.sikademo.com
  rules:
    - backendRefs:
        - name: hello-world
          port: 80
