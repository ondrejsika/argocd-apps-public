apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
spec:
  project: system
  destination:
    namespace: gateway
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  source:
    repoURL: https://github.com/ondrejsika/argocd-apps-public.git
    targetRevision: HEAD
    path: clusters/example_k3s_with_gw/_cluster/gateway/manifests
