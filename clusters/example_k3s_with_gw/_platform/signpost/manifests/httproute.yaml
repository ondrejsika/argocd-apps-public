apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: signpost
  namespace: signpost
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: signpost
  hostnames:
    - signpost.k3s.sikademo.com
  rules:
    - backendRefs:
        - name: signpost
          port: 80
