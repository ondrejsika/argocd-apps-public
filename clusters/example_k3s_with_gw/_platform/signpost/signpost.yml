apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signpost
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  destination:
    namespace: signpost
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://github.com/sikalabs/charts.git
      path: charts/signpost
      helm:
        valuesObject:
          signpost_yaml:
            SiteHeading: k3s
            CompanyName: Training
            CompanyDomain: sika.io
            CompanyUrl: https://sika.io
            Rows:
            - Cols:
              - Blocks:
                - Heading: Platform
                  Links:
                  - Title: ArgoCD
                    URL: https://argocd.k3s.sikademo.com
                  - Title: Headlamp
                    URL: https://headlamp.k3s.sikademo.com
              - Blocks:
                - Heading: Apps
                  Links:
                  - Title: Hello World
                    URL: https://hello-world.k3s.sikademo.com
    - repoURL: https://github.com/ondrejsika/argocd-apps-public.git
      path: clusters/example_k3s_with_gw/_platform/signpost/manifests
