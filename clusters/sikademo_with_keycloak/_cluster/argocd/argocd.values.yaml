server:
  ingress:
    enabled: true
    hostname: argocd.k8s.sikademo.com
    tls: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
      nginx.ingress.kubernetes.io/backend-protocol: HTTPS
configs:
  cm:
    url: https://argocd.k8s.sikademo.com
    exec.enabled: "true"
    oidc.config: |
      name: SSO
      issuer: https://keycloak.lab0.sikademo.com/realms/example
      clientID: argocd
      clientSecret: argocd
      requestedScopes: ["openid", "profile", "email", "groups"]
      logoutURL: "https://keycloak.lab0.sikademo.com/realms/example/protocol/openid-connect/logout?client_id=argocd&id_token_hint={{token}}&post_logout_redirect_uri=https://argocd.k8s.sikademo.com"
  rbac:
    scopes: '[groups]'
    policy.default: ""
    policy.csv: |
      g, argocd-admin, role:admin
      g, argocd-readonly, role:readonly
