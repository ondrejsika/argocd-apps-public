apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRef:
    name: gateway
    namespace: gateway
  listeners:
    - name: https
      hostname: argocd.k8s.sikademo.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - group: ''
            kind: Secret
            name: argocd.k8s.sikademo.com-tls
