apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: system
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 10.17.0
      helm:
        valueFiles:
          - $values/clusters/example_with_gw/_cluster/argocd/argocd.values.yaml
    - repoURL: https://github.com/ondrejsika/argocd-apps-public.git
      ref: values
    - repoURL: https://github.com/ondrejsika/argocd-apps-public.git
      path: ./clusters/example_with_gw/_cluster/argocd/manifests
