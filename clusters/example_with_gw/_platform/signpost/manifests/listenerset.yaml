apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: signpost
  namespace: signpost
spec:
  parentRef:
    name: gateway
    namespace: gateway
  listeners:
    - name: https
      hostname: signpost.k8s.sikademo.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: signpost.k8s.sikademo.com-tls
