apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: headlamp
  namespace: kube-system
spec:
  parentRef:
    name: gateway
    namespace: gateway
  listeners:
    - name: https
      hostname: headlamp.k8s.sikademo.com
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: headlamp.k8s.sikademo.com-tls
