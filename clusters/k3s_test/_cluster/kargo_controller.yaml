apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: https://github.com/akuity/kargo.git
    path: charts/kargo
    targetRevision: v1.11.4
    helm:
      valuesObject:
        # Kargo controller (shard), only the controller for shard "test",
        # Kargo data lives in the k3s_mgmt control plane
        image:
          tag: v1.11.4
        dataPlane:
          install: false
          controller:
            install: false
        api:
          enabled: false
        garbageCollector:
          enabled: false
        externalWebhooksServer:
          enabled: false
        managementController:
          enabled: false
        webhooksServer:
          enabled: false
        controller:
          shardName: test
        # Secret is created manually, see docs/kargo/README.md
        kubeconfigSecrets:
          kargo: kargo-control-plane-kubeconfig
