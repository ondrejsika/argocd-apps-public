apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-k3s
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: hello-k3s
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  sources:
    - repoURL: https://github.com/sikalabs/charts.git
      path: charts/hello-world
      helm:
        valueFiles:
          - $values/clusters/k3s_prod/hello_k3s/values/hello_k3s.common.values.yaml
          - $values/clusters/k3s_prod/hello_k3s/values/hello_k3s.env.values.yaml
    - repoURL: https://github.com/ondrejsika/argocd-apps-public.git
      ref: values
