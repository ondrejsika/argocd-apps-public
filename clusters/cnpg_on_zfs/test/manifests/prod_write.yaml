apiVersion: apps/v1
kind: Deployment
metadata:
  name: prod-write
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: prod-write
  template:
    metadata:
      labels:
        app: prod-write
    spec:
      containers:
        - name: main
          image: ghcr.io/sikalabsregistry/wip/slr:2026-11-10.1
          command: [ "/bin/sh", "-c"]
          args: [ "slr postgres-test-write-counter --uri $POSTGRES_URI" ]
          env:
            - name: POSTGRES_URI
              valueFrom:
                secretKeyRef:
                  name: postgres-prod-app
                  key: fqdn-uri
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
            limits:
              cpu: 500m
              memory: 500Mi
