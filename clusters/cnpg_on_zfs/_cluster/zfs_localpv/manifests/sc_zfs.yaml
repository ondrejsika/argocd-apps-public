apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: zfs
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: zfs.csi.openebs.io
parameters:
  poolname: tank/k8s
  fstype: zfs
  recordsize: 128k     # ZFS default, best for larger / sequential files
  compression: zstd    # better ratio than lz4, good for logs and objects
  atime: "off"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
