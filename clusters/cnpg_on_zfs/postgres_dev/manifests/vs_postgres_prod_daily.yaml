# Crash-consistent ZFS snapshot of the running prod PGDATA (PGDATA and WAL
# share one volume, so Postgres does a normal crash recovery on start).
# ArgoCD waits until it is readyToUse before creating postgres-dev (wave 1).
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: postgres-prod-daily
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  volumeSnapshotClassName: zfs
  source:
    persistentVolumeClaimName: postgres-prod-1
