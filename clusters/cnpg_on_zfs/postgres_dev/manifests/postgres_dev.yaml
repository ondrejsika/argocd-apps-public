apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-dev
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  # Skip the smart shutdown (which waits up to 180s for clients to disconnect)
  # and go straight to a fast shutdown, which terminates open connections,
  # so the daily reset does not wait for connected apps
  smartShutdownTimeout: 0
  storage:
    storageClass: zfs-pg
    # Keep the same size as postgres-prod, the volume is a ZFS clone of its snapshot
    size: 50Gi
  bootstrap:
    recovery:
      # Static credentials (secret_postgres_dev_credentials.yaml), so the dev
      # apps keep working across the daily reset
      database: app
      owner: app
      secret:
        name: postgres-dev-credentials
      volumeSnapshots:
        storage:
          name: postgres-prod-daily
          kind: VolumeSnapshot
          apiGroup: snapshot.storage.k8s.io
