apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-96"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    namespace: kargo
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    repoURL: https://github.com/akuity/kargo.git
    path: charts/kargo
    targetRevision: v1.11.4
    helm:
      valuesObject:
        image:
          tag: v1.11.4
        crds:
          install: true
          keep: true
        api:
          host: kargo.k3s-mgmt.sikademo.com
          tls:
            enabled: false
            terminatedUpstream: true
          adminAccount:
            enabled: true
            passwordHash: "$2y$10$WSVPqKHxmyoc6L7RzlVilucuWXnjDDfDQmyQIfAjoG/PL3AEjyuBq"
            tokenSigningKey: VDq8SYFpzAtxZPIYvVLobJyBle6D6foX
          oidc:
            enabled: true
            dex:
              enabled: true
              connectors:
                - id: sso
                  name: SSO
                  type: oidc
                  config:
                    issuer: https://sso.sikalabs.com/realms/training
                    clientID: example_client_id
                    clientSecret: example_client_secret
                    redirectURI: https://kargo.k3s-mgmt.sikademo.com/dex/callback
                    scopes:
                      - openid
                      - profile
                      - email
                      - groups
                    insecureEnableGroups: true
            additionalScopes:
              - groups
            admins:
              claims:
                groups:
                  - argocd-admins
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt
            tls:
              enabled: true
              selfSignedCert: false
              secretName: kargo-api-tls
