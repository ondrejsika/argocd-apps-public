apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: hello-k3s-dev
  namespace: hello-k3s-kargo
  annotations:
    kargo.akuity.io/color: "#2196F3"
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-k3s-kargo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: git@github.com:ondrejsika/argocd-apps-public.git
            checkout:
              - branch: master
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/clusters/k3s_dev/hello_k3s/hello_k3s.values.yaml
            updates:
              - key: image
                value: ${{ imageFrom("ttl.sh/kargo-example").RepoURL + ":" + imageFrom("ttl.sh/kargo-example").Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: 'chore(k3s_dev/hello_k3s): promote image ${{ imageFrom("ttl.sh/kargo-example").Tag }} to dev'
            author:
              name: SikaLabs[bot]
              email: sikalabsbot@sikalabs.com
        - uses: git-push
          config:
            path: ./repo
        - uses: http
          as: wait-for-rollout
          retry:
            timeout: 10m
          config:
            method: GET
            pollInterval: 10s
            responseContentType: text/plain
            url: https://hello.k3s-dev.sikademo.com/
            successExpression: 'response.status == 200 && type(response.body) == "string" && response.body contains "${{ imageFrom("ttl.sh/kargo-example").Tag }} "'
