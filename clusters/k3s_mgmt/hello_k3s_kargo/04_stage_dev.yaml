apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: hello-k3s-dev
  namespace: hello-k3s-kargo
  annotations:
    kargo.akuity.io/color: "#2196F3"
spec:
  shard: dev
  requestedFreight:
    - origin:
        kind: Warehouse
        name: hello-k3s-kargo
      sources:
        direct: true
  promotionTemplate:
    spec:
      steps:
        - uses: git-clone
          config:
            repoURL: git@github.com:ondrejsika/argocd-apps-public.git
            checkout:
              - branch: master
                path: ./repo
        - uses: yaml-update
          config:
            path: ./repo/clusters/k3s_dev/hello_k3s/values/hello_k3s.env.values.yaml
            updates:
              - key: image
                value: ${{ imageFrom("ttl.sh/kargo-example").RepoURL + ":" + imageFrom("ttl.sh/kargo-example").Tag }}
        - uses: git-commit
          config:
            path: ./repo
            message: 'chore(k3s_dev/hello_k3s): promote image ${{ imageFrom("ttl.sh/kargo-example").Tag }} to dev'
            author:
              name: SikaLabs[bot]
              email: sikalabsbot@sikalabs.com
        - uses: git-push
          as: push
          config:
            path: ./repo
        - uses: argocd-update
          as: wait-for-rollout
          config:
            apps:
              - name: hello-k3s
                sources:
                  - repoURL: https://github.com/ondrejsika/argocd-apps-public.git
                    desiredRevision: ${{ outputs.push.commit }}
