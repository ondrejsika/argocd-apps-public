apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps-k3s-mgmt
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    path: clusters/k3s_mgmt
    repoURL: https://github.com/ondrejsika/argocd-apps-public.git
    targetRevision: HEAD
    directory:
      recurse: true
      exclude: '{**/manifests/**,**/Chart.yaml,**/values.y*ml,**/*.values.y*ml,**/templates/**}'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Kargo resources (hello_k3s_kargo) need Kargo CRDs, which are installed
    # by the kargo app, so skip the dry run and retry until they exist
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
